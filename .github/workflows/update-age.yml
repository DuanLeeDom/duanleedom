name: Update README Age

on:
  schedule:
    - cron: '0 0 * * *' # Executa diariamente à meia-noite (UTC)
  push:
    branches:
      - main # Executa em pushes na branch main
  workflow_dispatch: # Permite execução manual

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate and update age
        run: |
          node -e "
          const birthDate = new Date('2005-09-18');
          const today = new Date();
          let age = today.getFullYear() - birthDate.getFullYear();
          const monthDiff = today.getMonth() - birthDate.getMonth();
          if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
            age--;
          }
          const fs = require('fs');
          let content = fs.readFileSync('README.md', 'utf-8');
          const updatedContent = content.replace(/<!-- AGE -->/g, age);
          if (content !== updatedContent) {
            fs.writeFileSync('README.md', updatedContent);
            console.log('README updated with age:', age);
          } else {
            console.log('No changes needed');
          }
          "

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update age in README' || echo "No changes to commit"
          git push
